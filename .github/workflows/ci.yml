name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Live tests skip themselves: IBKR_LIVE, IBKR_FLEX_TOKEN and IBKR_FLEX_QUERY are never set here.
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: swift build --package-path Examples/IBKRExample
      - run: xcodebuild -scheme swift-ibkr-Package -destination 'generic/platform=iOS' build

  linux:
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "latest"]
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift test
      - run: swift build --package-path Examples/IBKRExample

  windows:
    runs-on: windows-latest
    steps:
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f   # v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift test

  # The differential oracle: regenerate ib_async 2.1.0's answers offline and fail if the committed JSON differs.
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r Scripts/differential/requirements.txt
      - run: python -I Scripts/differential/generate.py
      - run: git diff --exit-code

  pod-lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: pod lib lint SwiftIBKR.podspec
